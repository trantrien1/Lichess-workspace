[project]
name = "lichess-wdl-prediction"
version = "0.1.0"
description = "Bounded, history-aware Stockfish WDL service for self-hosted Lichess"
requires-python = ">=3.12"
dependencies = ["chess>=1.11,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
ml = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "zstandard>=0.23,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
